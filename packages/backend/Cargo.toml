[package]
name = "palform-backend"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
apistos = { version = "0.6", features = ["chrono"] }
actix-web = { version = "4" }
actix-multipart = { version = "0.7" }
actix-cors = { version = "0.7" }
http = "0.2"
tokio = { version = "1.50" }
regex = { version = "1.12" }
schemars = { package = "apistos-schemars", version = "0.8", features = [
    "url",
    "chrono",
] }
sea-orm = { version = "1.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }
figment = { version = "0.10", features = ["env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
openidconnect = { version = "4", features = [
    "reqwest",
    "rustls-tls",
    "accept-rfc3339-timestamps",
] }
thiserror = "2.0"
url = { version = "2", features = ["serde"] }
chrono = "0.4"
rand = "0.10"
log = "0.4"
env_logger = { version = "0.11" }
base64 = "0.22"
sequoia-openpgp = { version = "2.0", default-features = false, features = [
    "crypto-rust",
    "allow-variable-time-crypto",
    "allow-experimental-crypto",
] }
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "http2",
    "rustls-tls",
] }
rust-s3 = { version = "0.37", default-features = false, features = [
    "tokio-rustls-tls",
] }
argon2 = "0.5.3"
validator = { version = "0.20", features = ["derive"] }
totp-rs = { version = "5.6" }
rust-i18n = { version = "3" }
accept-language = { version = "3" }
clap = { default-features = false, features = [
    "std",
    "help",
], version = "4.5.21" }
faster-hex = "0.10.0"
ring = "0.17"
webauthn-rs = { version = "0.5", features = [
    "danger-allow-state-serialisation",
] }
altcha = "0.2"
redis = { version = "1", features = ["tokio-comp"] }
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
blake3 = "1"
async-stripe = { version = "0.41", default-features = false, features = [
    "runtime-tokio-hyper-rustls",
] }

csv = { version = "1.3.1", optional = true }
bytes = { version = "1.8", optional = true }
nodit = { version = "0.10", optional = true }
keshvar = { version = "0.5.0", optional = true, features = ["emojis"] }

palform-tsid = { path = "../tsid" }
palform-migration = { path = "../migration" }
palform-entities = { path = "../entities" }
palform-client-common = { path = "../client-common", default-features = false, features = [
    "backend",
] }
palform-crypto = { path = "../crypto", default-features = false }

[features]
default = ["saas", "country-metadata"]
saas = [
    "async-stripe/billing",
    "async-stripe/checkout",
    "async-stripe/connect",
    "async-stripe/webhook-events",
    "dep:csv",
    "dep:bytes",
    "dep:nodit",
]
country-metadata = ["dep:keshvar"]
