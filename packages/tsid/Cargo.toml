[package]
name = "palform-tsid"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
prefixed-tsid = { version = "0.9.0", default-features = false }

[features]
default = ["sea-orm", "serde", "ts-rs", "apistos"]
sea-orm = ["prefixed-tsid/sea-orm"]
serde = ["prefixed-tsid/serde"]
ts-rs = ["prefixed-tsid/ts-rs"]
apistos = ["prefixed-tsid/apistos"]
