[package]
name = "palform-entities"
version = "0.1.0"
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
schemars = { package = "apistos-schemars", version = "0.8", default-features = false }
sea-orm = "1.0"
serde = { version = "1.0", features = ["derive"] }
palform-tsid = { path = "../tsid", features = ["sea-orm", "apistos"] }
