name: Build frontend containers

on:
  push:
    branches:
      - main
      - big-update

concurrency:
  group: frontends-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frontend: ["frontend", "blogdocs", "landing"]
        env: ["production", "staging"]
    environment:
      name: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v5

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/palform/palform-${{ matrix.frontend }}:latest-${{ matrix.env }}
            ghcr.io/palform/palform-${{ matrix.frontend }}:${{ github.sha }}-${{ matrix.env }}
          platforms: linux/amd64
          context: .
          file: ./Containerfile.${{ matrix.frontend }}
          build-args: |
            BACKEND_URL=${{ vars.BACKEND_URL }}
            FRONTEND_URL=${{ vars.FRONTEND_URL }}
            URLS_BASE=${{ vars.URLS_BASE }}
            ENABLE_BILLING=true
            MAPBOX_API_KEY=${{ vars.MAPBOX_API_KEY }}
            CAPTCHA_SITE_KEY=${{ vars.CAPTCHA_SITE_KEY }}
            SKIP_CAPTCHA=false
